name: transport-symbol-diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/transport-symbol-diagnostic.yml"
permissions:
  contents: read
jobs:
  symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compare normal and sanitized poll linkage
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          c++ --version
          mkdir -p diagnostic
          for mode in plain sanitized
          do
            flags=(-std=c++20 -O2 -g -DNDEBUG -Wall -Wextra -Werror -pedantic -pthread -Isrc -Iinclude)
            if [ "$mode" = sanitized ]
            then
              flags+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            c++ "${flags[@]}" -c src/supervisor/unix_http_transport.cpp -o "diagnostic/$mode-transport.o"
            c++ "${flags[@]}" src/supervisor/http1_parser.cpp "diagnostic/$mode-transport.o" tests/supervisor/unix_http_fault_independent_test.cpp -Wl,--wrap=connect -Wl,--wrap=send -Wl,--wrap=poll -o "diagnostic/$mode-faults"
            python3 - "$mode" <<'PY'
          import subprocess, sys
          mode = sys.argv[1]
          for kind, path in [("object", f"diagnostic/{mode}-transport.o"), ("binary", f"diagnostic/{mode}-faults")]:
              output = subprocess.check_output(["nm", "-C", path], text=True)
              for line in output.splitlines():
                  if any(name in line for name in ["poll", "interceptor", "_chk"]):
                      print(mode, kind, line)
          PY
            set +e
            "diagnostic/$mode-faults"
            result=$?
            set -e
            echo "$mode diagnostic exit: $result (not an acceptance run)"
          done
